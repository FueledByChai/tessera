name: CI

# The definition of done, run by the same script a developer runs locally (scripts/check.sh),
# so CI and the checkout agree on what "passing" means. The engine job is
# `scripts/check.sh --quick`: fmt, tests, build, and parity of the bundled examples against
# examples/expected (the private checks skip, since that checkout is not here). The web job is
# `scripts/check.sh --web-only`: typecheck, lint, theme check, build, and the headless layout and
# chart checks, which need a Chromium (playwright's, a web devDependency) and a console to open
# pages from: scripts/scratch-console.sh serves one on the bundled example data with a seeded
# run and study, which is why the web job also builds the engine. Both jobs are required
# status checks on main, and a pull request must be up to date with main when they pass: after
# another PR merges, a branch is rebased (scripts/open-ticket-pr.sh <id> --update) and both jobs
# run again on the exact result that would land (HK-10).
#
# The engine job also installs cargo-llvm-cov (the coverage ratchet, HK-23) and checks out the
# full history so the proof gate can diff the branch against origin/main.
#
# The browser (HK-17): playwright's Chromium is cached under ~/.cache/ms-playwright, keyed on
# the lock file, so a run on the same dependencies restores it instead of downloading it. The
# system libraries it needs come from apt on every run, and apt's mirrors have failed with
# index hash mismatches on a docs-only PR; the install step therefore retries once after a
# pause before failing. On a cache hit only the libraries are installed.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine (scripts/check.sh --quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh --quick

  web:
    name: Web (scripts/check.sh --web-only with a scratch console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Cache playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install playwright's Chromium (retrying once if apt's mirror fails)
        working-directory: web
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo "browser restored from the cache; installing its system libraries only"
            cmd="npx playwright install-deps chromium"
          else
            cmd="npx playwright install --with-deps chromium"
          fi
          if ! $cmd; then
            echo "install failed once (apt mirror?); retrying in 20 s"
            sleep 20
            $cmd
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the engine for the scratch console
        run: cargo build --release --bin tessera --bin tessera-ui
      - name: Start a scratch console on the bundled example data
        run: scripts/scratch-console.sh start
      - run: scripts/check.sh --web-only
      - name: Stop the scratch console
        if: always()
        run: scripts/scratch-console.sh stop
