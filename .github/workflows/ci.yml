name: CI

# The definition of done, run by the same script a developer runs locally (scripts/check.sh),
# so CI and the checkout agree on what "passing" means. The engine job is
# `scripts/check.sh --quick`: fmt, tests, build, and parity of the bundled examples against
# examples/expected (the private checks skip, since that checkout is not here). The web job is
# `scripts/check.sh --web-only`: typecheck, lint, theme check, build; the headless layout and
# chart checks report that they skipped until a Chromium is installed on the runner (HK-07).

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Engine (scripts/check.sh --quick)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh --quick

  web:
    name: Web (scripts/check.sh --web-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: scripts/check.sh --web-only
