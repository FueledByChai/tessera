# Settings for the ticket loop (HK-14), read by scripts/loop-config.sh for
# scripts/backlog-status.sh, scripts/open-ticket-pr.sh, and scripts/release-notes.sh. One flat
# table; strings double-quoted, arrays on one line. `scripts/loop-config.sh --all` shows the
# effective values, defaults included. TOML is only the config format: nothing here depends on
# the project's language.
[loop]
default_branch = "main"
backlog = "BACKLOG.md"
check = "scripts/check.sh"
check_fast = "scripts/check.sh --no-web"
# A change under these paths is a parity-baseline refresh, the one kind of change the checks
# cannot judge: the PR is labelled needs-review and waits for the owner instead of auto-merging.
review_paths = ["examples/expected/"]
trailer_required = true
# The loop kit: the source of the loop scripts and the prompts. `scripts/loop-kit-sync.sh
# --check` fails when scripts/ or loop/prompts/ drift from the tag; move kit_ref to take a
# newer release, then run the sync.
kit = "https://github.com/FueledByChai/coding-agent-loop"
kit_ref = "v0.17.0"
# The proof gate (scripts/proof-gate.sh, HK-23): a change under src/ must come with a change
# under a proof path, or add a #[test] or #[cfg(test)] line, or say why in the commit body
# (`No new test: <reason>`).
code_paths = ["src/"]
proof_paths = ["tests/", "examples/expected/", "web/fixtures/", "web/scripts/*-check.mjs"]
proof_pattern = "#\\[test\\]|#\\[cfg\\(test\\)\\]"
# The coverage ratchet (scripts/coverage-ratchet.sh): scripts/coverage.sh prints the crate's
# line coverage from cargo-llvm-cov; the check fails below coverage-floor.txt, and a ticket
# that raises coverage raises the floor with `scripts/coverage-ratchet.sh --set`.
coverage = "scripts/coverage.sh"
coverage_floor = "coverage-floor.txt"
# The suite's coverage jitters by about a tenth of a point run to run (HK-26); 0.2 absorbs it.
coverage_slack = "0.2"
# Decision records (scripts/decisions.sh, HK-31): one numbered file per decision, never
# edited in place; grill-me reads the index before asking and writes a record when a story
# needs a decision. HK-33 migrates the locked product decisions here.
decisions = "docs/decisions"
# The sprint (HK-39): the tickets chosen for now, in the order to work them. backlog-status.sh
# --next takes the first ready one of these before file order; --sprint shows their states.
# Choosing a sprint is a commit that edits this list; a ticket keeps no sprint state.
sprint = ["HK-33", "UI-04", "UI-05", "UI-06"]
# The product backlog (HK-40): stories with acceptance criteria that tickets say they serve
# ("Serves BT-nnn"); backlog-status.sh --stories derives each story's status from them.
stories = "docs/PRODUCT_BACKLOG.md"
