# Runs the bundled moving-average-cross example against the synthetic data.
#   cargo run --release --bin backtester -- run-strategy \
#     --config examples/configs/moving_average_cross.toml \
#     --start 2019-01-01 --end 2025-12-31 --output-dir artifacts/ma_cross_demo
strategy = "moving_average_cross"

[data]
resolution = "daily"
session = "regular"
daily_dir = "examples/data/eod"
five_minute_dir = "examples/data/5m"
one_minute_dir = "examples/data/1m"
symbols = ["DEMO.US"]
calendar_symbol = "DEMO.US"

[sizing]
initial_capital = 100000.0
position_percent = 1.0

[costs]

[limits]

[parameters]
fast_length = 20
slow_length = 100
