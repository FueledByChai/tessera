# Toolchain steps for a Node or TypeScript project, written by grill-project into
# .github/workflows/loop.yml between the checkout step and the `run: scripts/check.sh` line
# (same indentation as those steps). Every step tolerates the empty repository, so the
# workflow is green before the manifest exists; the comments say what to add once it does.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Add `cache: npm` once package-lock.json exists (the cache step fails without it).
      - run: test -f package-lock.json && npm ci || echo "no package-lock.json yet"
