# Copy to `local.toml` (git-ignored) and point it at your market-data library.
# Without a local.toml the app uses the small synthetic dataset under examples/data.
#
# Environment overrides: TESSERA_DATA_ROOT (folder holding eod/, 5m/, 1m/, catalog/),
# TESSERA_ENGINE (engine binary), TESSERA_STRATEGY_DIRS (extra strategy folders).

[data]
# CSV folders, one file per symbol named `<SYMBOL>.csv`.
#   daily:    Date,Open,High,Low,Close,Adjusted_close,Volume
#   intraday: Timestamp,Gmtoffset,Datetime,Open,High,Low,Close,Volume   (UTC epoch seconds)
daily_dir = "/path/to/data/eod"
five_minute_dir = "/path/to/data/5m"
one_minute_dir = "/path/to/data/1m"
# catalog.csv (Code,Name,Country,Exchange,Currency,Type) plus optional stocks.txt / etfs.txt
# universe lists and provider sub-catalogs (CC/, FOREX/, delisted/) in the same layout.
catalog_dir = "/path/to/data/catalog"
# Daily file whose dates define the trading calendar for screened-universe runs.
calendar_symbol = "SPY.US"
# Keeping the library current is the console's job: register the provider account as a
# source on the Data page and schedule its datasets there (docs/DATA_SOURCES.md).
# Optional: parquet tick lake for crypto/HFT research. Feeds trades/, book_snapshots/,
# book_events/ partitioned as exchange=<EX>/symbol=<SYM>/date=<YYYY-MM-DD>/*.parquet.
# Enables EXCHANGE:SYMBOL instruments (e.g. PARADEX:SOL-USD-PERP) and 1s/5s/30s bars.
# lake_dir = "/path/to/lake"

# Optional: exogenous series studies can use as feature bases (`cpi_surprise | zscore 12`),
# joined to bars as-of the moment each row became observable, never its nominal date. One
# `[[data.series]]` per file (CSV or parquet). `kind` is "level" (carried forward) or "event"
# (the value on the first bar that sees it, zero elsewhere). Availability comes from an
# `available_at_column` or a fixed `publication_lag_secs` after the nominal time. Funding
# and open interest from the lake (funding_rate, funding_annualized, open_interest,
# open_interest_usd) register on their own for lake instruments.
# [[data.series]]
# name = "cpi_surprise"
# path = "/path/to/series/cpi_surprise.csv"     # columns: time,available_at,value
# kind = "event"
# time_column = "time"
# value_column = "value"
# available_at_column = "available_at"
# [[data.series]]
# name = "short_interest"
# path = "/path/to/series/short_interest.csv"   # columns: time,symbol,value
# symbol_column = "symbol"
# publication_lag_secs = 1209600                # published two weeks after the nominal date

[engine]
# Optional: run strategies with a different engine binary, for example one built from a
# private strategies repository. Defaults to target/release/tessera in this checkout.
# path = "../Tessera-private/target/release/tessera"

[strategies]
# Extra folders of one-file SDK strategies compiled into this checkout's engine.
# dirs = ["../Tessera-private/strategies"]
