[package]
name = "tessera-engine"
description = "Tessera: an event-driven backtesting engine with a one-file strategy SDK and a terminal-style local UI"
license = "AGPL-3.0-only"
repository = "https://github.com/FueledByChai/tessera"
version = "0.1.0"
edition = "2024"

[lib]
name = "tessera"
path = "src/lib.rs"

[[bin]]
name = "tessera"
path = "src/main.rs"

[[bin]]
name = "tessera-ui"
path = "src/bin/tessera_ui.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.3"
polars = { version = "0.54.4", default-features = false, features = ["parquet", "dtype-decimal", "dtype-struct", "fmt", "csv"] }
# statvfs for a registered source's root volume (DS-03); already in the lock as a transitive dependency.
libc = "0.2"
rand = "0.9"
rayon = "1.10"
# The provider adapters' HTTP client (decision 0020). Already in the lock through polars-io,
# with the same features; rustls, not the platform TLS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }

[profile.release]
# Keep optimized iteration fast. Enable LTO only after benchmarks prove it matters.
codegen-units = 16
